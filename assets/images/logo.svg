<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 36" fill="none">
  <defs>
    <linearGradient id="zvIconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2299" />
      <stop offset="100%" stop-color="#0B132B" />
    </linearGradient>
    <linearGradient id="zvZGlyph" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4306D" />
      <stop offset="100%" stop-color="#F7DE7A" />
    </linearGradient>
  </defs>

  <!-- Modern Geometric Monogram Icon -->
  <g transform="translate(0, 2)">
    <rect width="32" height="32" rx="8" fill="url(#zvIconBg)" />
    <!-- Dynamic Z-Prism -->
    <path d="M8 9h16l-9.5 8.5H24v4.5H8l9.5-8.5H8V9z" fill="url(#zvZGlyph)" />
    <!-- Pulse Accent Dot -->
    <circle cx="23" cy="9.5" r="2" fill="#F7DE7A" />
  </g>

  <!-- Brand Wordmark -->
  <text x="42" y="22" 
        font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Inter', sans-serif" 
        font-weight="900" 
        font-size="20" 
        fill="#0B132B" 
        letter-spacing="1.2">ZAVORA</text>

  <!-- Micro Category Subtitle -->
  <text x="43" y="31" 
        font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" 
        font-weight="800" 
        font-size="6.5" 
        fill="#E4306D" 
        letter-spacing="2.2">MARKETPLACE</text>
</svg>
